name: Deploy Worker

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      service_to_deploy:
        description: "Service to deploy"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "user"
          - "admin"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

  release:
    name: Semantic Release
    needs: [lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run semantic-release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrate-db:
    name: Apply D1 Migrations
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: packages/db
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply harka-db --remote

  deploy-user:
    name: Deploy User Worker
    runs-on: ubuntu-latest
    needs: [lint, migrate-db]
    if: contains(github.event.head_commit.message, 'deploy_user') || inputs.service_to_deploy == 'user' || inputs.service_to_deploy == 'all'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build User Application
        run: bun run build:user

      - uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: apps/user
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-admin:
    name: Deploy Admin Worker
    runs-on: ubuntu-latest
    needs: [lint, migrate-db]
    if: contains(github.event.head_commit.message, 'deploy_admin') || inputs.service_to_deploy == 'admin' || inputs.service_to_deploy == 'all'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Admin Application
        run: bun run build:admin

      - uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: apps/admin
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
